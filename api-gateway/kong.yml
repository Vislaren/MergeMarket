_format_version: "3.0"
_transform: true

services:
  - name: auth-service
    url: https://auth:8091
    tls_verify: false
    routes:
      - name: auth-register
        paths: ["/api/v1/auth/register"]
        methods: ["POST"]
        strip_path: false
      - name: auth-login
        paths: ["/api/v1/auth/login"]
        methods: ["POST"]
        strip_path: false
      - name: auth-refresh
        paths: ["/api/v1/auth/refresh"]
        methods: ["POST"]
        strip_path: false

  - name: search-service
    url: http://search:8087
    routes:
      - name: search
        paths: ["/api/v1/search"]
        methods: ["GET"]
        strip_path: false

  - name: userdata-service
    url: http://userdata:8090
    routes:
      - name: wishlist
        paths: ["/api/v1/wishlist"]
        methods: ["GET", "POST"]
        strip_path: false
      - name: wishlist-item
        paths: ["~/api/v1/wishlist/[^/]+$"]
        methods: ["DELETE"]
        strip_path: false
      - name: alerts
        paths: ["/api/v1/alerts"]
        methods: ["GET", "POST"]
        strip_path: false
      - name: alert-item
        paths: ["~/api/v1/alerts/[^/]+$"]
        methods: ["DELETE"]
        strip_path: false
      - name: savings
        paths: ["/api/v1/savings"]
        methods: ["GET"]
        strip_path: false

  - name: history-service
    url: http://history:8085
    routes:
      - name: product-history
        paths: ["~/api/v1/products/[^/]+/history$"]
        methods: ["GET"]
        strip_path: false

plugins:
  - name: rate-limiting
    config:
      minute: 120
      hour: 2000
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  - name: jwt
    service: search-service
    config:
      key_claim_name: iss
      claims_to_verify: ["exp"]
      run_on_preflight: false

  - name: jwt
    service: userdata-service
    config:
      key_claim_name: iss
      claims_to_verify: ["exp"]
      run_on_preflight: false

  - name: jwt
    service: history-service
    config:
      key_claim_name: iss
      claims_to_verify: ["exp"]
      run_on_preflight: false

consumers:
  - username: mergemarket-auth
    jwt_secrets:
      - key: mergemarket-auth
        algorithm: HS256
        secret: __JWT_SECRET__
