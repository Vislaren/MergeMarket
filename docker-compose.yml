# ─────────────────────────────────────────────────────────────────────────
# MergeMarket — Local Development Environment
# ─────────────────────────────────────────────────────────────────────────
# Spins up the backing infrastructure for local development:
#   - postgres   : PostgreSQL + TimescaleDB (app data + price_history hypertable)
#   - redis      : cache, proxy pool, sessions
#   - kong       : API gateway (DB-less, declarative config)
#   - sonarqube  : code quality (backed by its own sonar-db)
#   - sonar-db   : dedicated PostgreSQL for SonarQube
#
# Usage:
#   cp .env.example .env      # then edit secrets
#   docker compose up -d
#   docker compose ps         # all services should report (healthy)
#   docker compose down       # stop; add -v to also wipe data volumes
#
# Note: SonarQube embeds Elasticsearch, which requires the host kernel setting
#   vm.max_map_count >= 262144
# On Linux:   sudo sysctl -w vm.max_map_count=262144   (persist in /etc/sysctl.conf)
# On Docker Desktop (Win/Mac) the embedded VM usually satisfies this already.
#
# The Go services themselves are NOT containerised here; they are run on the
# host during development and connect to these containers via localhost ports.
# ─────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: mm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Bootstrap schema runs once on an empty data volume (lexical order).
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mergemarket

  redis:
    image: redis:7-alpine
    container_name: mm-redis
    restart: unless-stopped
    # REDIS_PASSWORD may be empty locally; the entrypoint enables auth only if set.
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ];
             then exec redis-server --requirepass "$$REDIS_PASSWORD";
             else exec redis-server; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mergemarket

  kong:
    image: kong:3.7
    container_name: mm-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
    ports:
      - "${KONG_PROXY_PORT}:8000"
      - "${KONG_PROXY_SSL_PORT}:8443"
      - "${KONG_ADMIN_PORT}:8001"
      - "${KONG_ADMIN_SSL_PORT}:8444"
    volumes:
      # A-09 replaces this stub with the full route/plugin config.
      - ./api-gateway/kong.yml:/kong/declarative/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - mergemarket

  sonar-db:
    image: postgres:16-alpine
    container_name: mm-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SONAR_DB_USER}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      POSTGRES_DB: sonar
    # Not exposed to the host — only SonarQube reaches it over the compose network.
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER} -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mergemarket

  sonarqube:
    image: sonarqube:community
    container_name: mm-sonarqube
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # SonarQube takes ~1-2 min to boot; status flips to UP when ready.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000/api/system/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - mergemarket

volumes:
  pgdata:
  redisdata:
  sonar_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  mergemarket:
    driver: bridge
