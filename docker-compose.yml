# MergeMarket VPS / local orchestration
#
# This stack builds and runs the implemented backend services plus the backing
# infrastructure needed by Kong, PostgreSQL/TimescaleDB, Redis, SonarQube, and
# Grafana. It is suitable for the VPS Docker Compose deploy path.
#
# Usage:
#   cp .env.example .env
#   docker compose build
#   docker compose up -d
#   docker compose --profile dev up -d mock-server   # optional local mock API

x-app-env: &app-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  TIMESCALE_HOST: postgres
  TIMESCALE_PORT: 5432
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_DB: ${REDIS_DB}
  JWT_SECRET: ${JWT_SECRET}

x-db-depends: &db-depends
  postgres:
    condition: service_healthy

x-redis-depends: &redis-depends
  redis:
    condition: service_healthy

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: mm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mergemarket

  redis:
    image: redis:7-alpine
    container_name: mm-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ];
             then exec redis-server --requirepass "$$REDIS_PASSWORD";
             else exec redis-server; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mergemarket

  auth:
    build:
      context: ./services/auth
    image: mergemarket/auth:${IMAGE_TAG:-local}
    container_name: mm-auth
    restart: unless-stopped
    depends_on:
      <<: [*db-depends, *redis-depends]
    environment:
      <<: *app-env
      AUTH_PORT: 8091
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS}
      REFRESH_TOKEN_EXPIRY_DAYS: ${REFRESH_TOKEN_EXPIRY_DAYS}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL}
      AUTH_TLS_CERT_FILE: /certs/auth.local.crt
      AUTH_TLS_KEY_FILE: /certs/auth.local.key
    ports:
      - "${AUTH_PORT}:8091"
    volumes:
      - auth_certs:/certs
    networks:
      - mergemarket

  proxy-validator:
    build:
      context: ./services/proxy-validator
    image: mergemarket/proxy-validator:${IMAGE_TAG:-local}
    container_name: mm-proxy-validator
    restart: unless-stopped
    depends_on:
      <<: *redis-depends
    environment:
      <<: *app-env
      PROXY_VALIDATOR_PORT: 8086
      PROXY_SOURCES: ${PROXY_SOURCES}
      PROXY_POOL_KEY: ${PROXY_POOL_KEY}
      PROXY_POOL_TTL: ${PROXY_POOL_TTL}
      PROXY_TEST_URL: ${PROXY_TEST_URL}
      PROXY_TEST_TIMEOUT: ${PROXY_TEST_TIMEOUT}
      PROXY_VALIDATOR_CONCURRENCY: ${PROXY_VALIDATOR_CONCURRENCY}
      PROXY_REFRESH_INTERVAL: ${PROXY_REFRESH_INTERVAL}
      PROXY_POLITENESS_MIN: ${PROXY_POLITENESS_MIN}
      PROXY_POLITENESS_MAX: ${PROXY_POLITENESS_MAX}
    ports:
      - "${PROXY_VALIDATOR_PORT}:8086"
    networks:
      - mergemarket

  scraper:
    build:
      context: ./services/scraper-service
    image: mergemarket/scraper:${IMAGE_TAG:-local}
    container_name: mm-scraper
    restart: unless-stopped
    depends_on:
      <<: *redis-depends
      proxy-validator:
        condition: service_started
    environment:
      <<: *app-env
      SCRAPER_PORT: 8083
      SCRAPER_CONFIG_DIR: /app/configs
      SCRAPER_WORKERS: ${SCRAPER_WORKERS}
      SCRAPER_JOB_QUEUE: ${SCRAPER_JOB_QUEUE}
      SCRAPER_NORMALIZE_QUEUE: ${SCRAPER_NORMALIZE_QUEUE}
      SCRAPER_QUEUE_POLL_TIMEOUT: ${SCRAPER_QUEUE_POLL_TIMEOUT}
      SCRAPER_SCRAPE_TIMEOUT: ${SCRAPER_SCRAPE_TIMEOUT}
      SCRAPER_CIRCUIT_THRESHOLD: ${SCRAPER_CIRCUIT_THRESHOLD}
      SCRAPER_CIRCUIT_COOLDOWN: ${SCRAPER_CIRCUIT_COOLDOWN}
      SCRAPER_USE_PROXY: ${SCRAPER_USE_PROXY}
      PROXY_POOL_KEY: ${PROXY_POOL_KEY}
    ports:
      - "${SCRAPER_PORT}:8083"
    volumes:
      - ./services/scraper-service/configs:/app/configs:ro
    networks:
      - mergemarket

  normalization:
    build:
      context: ./services/normalization
    image: mergemarket/normalization:${IMAGE_TAG:-local}
    container_name: mm-normalization
    restart: unless-stopped
    depends_on:
      <<: [*db-depends, *redis-depends]
    environment:
      <<: *app-env
      NORMALIZATION_PORT: 8084
      NORMALIZATION_WORKERS: ${NORMALIZATION_WORKERS}
      NORMALIZATION_QUEUE_POLL_TIMEOUT: ${NORMALIZATION_QUEUE_POLL_TIMEOUT}
      NORMALIZATION_AFFILIATE_CONFIG: ${NORMALIZATION_AFFILIATE_CONFIG}
      SCRAPER_NORMALIZE_QUEUE: ${SCRAPER_NORMALIZE_QUEUE}
    ports:
      - "${NORMALIZATION_PORT}:8084"
    volumes:
      - ./services/normalization/configs:/app/configs:ro
    networks:
      - mergemarket

  history:
    build:
      context: ./services/history
    image: mergemarket/history:${IMAGE_TAG:-local}
    container_name: mm-history
    restart: unless-stopped
    depends_on:
      <<: [*db-depends, *redis-depends]
    environment:
      <<: *app-env
      HISTORY_PORT: 8085
      HISTORY_SNAPSHOT_INTERVAL: ${HISTORY_SNAPSHOT_INTERVAL}
      HISTORY_SNAPSHOT_ON_START: ${HISTORY_SNAPSHOT_ON_START}
      HISTORY_HEARTBEAT_INTERVAL: ${HISTORY_HEARTBEAT_INTERVAL}
      HISTORY_HEARTBEAT_ON_START: ${HISTORY_HEARTBEAT_ON_START}
      HISTORY_HEARTBEAT_MODE: ${HISTORY_HEARTBEAT_MODE}
      HISTORY_HEARTBEAT_TIMEOUT: ${HISTORY_HEARTBEAT_TIMEOUT}
      HISTORY_ALERT_QUEUE: ${HISTORY_ALERT_QUEUE}
    ports:
      - "${HISTORY_PORT}:8085"
    networks:
      - mergemarket

  search:
    build:
      context: ./services/search
    image: mergemarket/search:${IMAGE_TAG:-local}
    container_name: mm-search
    restart: unless-stopped
    depends_on:
      <<: [*db-depends, *redis-depends]
    environment:
      <<: *app-env
      SEARCH_PORT: 8087
      SEARCH_CACHE_PREFIX: ${SEARCH_CACHE_PREFIX}
      SEARCH_CACHE_TTL: ${SEARCH_CACHE_TTL}
      SEARCH_CACHE_STALE_AFTER: ${SEARCH_CACHE_STALE_AFTER}
      SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS}
    ports:
      - "${SEARCH_PORT}:8087"
    networks:
      - mergemarket

  userdata:
    build:
      context: ./services/userdata
    image: mergemarket/userdata:${IMAGE_TAG:-local}
    container_name: mm-userdata
    restart: unless-stopped
    depends_on:
      <<: *db-depends
    environment:
      <<: *app-env
      USERDATA_PORT: 8090
      USERDATA_JWT_ISSUER: ${USERDATA_JWT_ISSUER}
    ports:
      - "${USERDATA_PORT}:8090"
    networks:
      - mergemarket

  kong:
    image: kong:3.7
    container_name: mm-kong
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_started
      search:
        condition: service_started
      userdata:
        condition: service_started
      history:
        condition: service_started
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
      JWT_SECRET: ${JWT_SECRET}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      secret=$$(printf '%s' "$$JWT_SECRET" | sed 's/[\/&]/\\&/g');
      sed "s|__JWT_SECRET__|$${secret}|g" /kong/declarative/kong.yml > /kong/generated/kong.yml;
      exec kong docker-start
    ports:
      - "${KONG_PROXY_PORT}:8000"
      - "${KONG_PROXY_SSL_PORT}:8443"
      - "${KONG_ADMIN_PORT}:8001"
      - "${KONG_ADMIN_SSL_PORT}:8444"
    volumes:
      - ./api-gateway/kong.yml:/kong/declarative/kong.yml:ro
      - kong_generated:/kong/generated
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - mergemarket

  mock-server:
    profiles: ["dev"]
    build:
      context: ./services/mock-server
    image: mergemarket/mock-server:${IMAGE_TAG:-local}
    container_name: mm-mock-server
    restart: unless-stopped
    environment:
      MOCK_SERVER_PORT: 8089
    ports:
      - "${MOCK_SERVER_PORT}:8089"
    networks:
      - mergemarket

  sonar-db:
    image: postgres:16-alpine
    container_name: mm-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SONAR_DB_USER}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER} -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mergemarket

  sonarqube:
    image: sonarqube:community
    container_name: mm-sonarqube
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000/api/system/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - mergemarket

  grafana:
    image: grafana/grafana:11.1.0
    container_name: mm-grafana
    restart: unless-stopped
    depends_on:
      sonarqube:
        condition: service_started
    environment:
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      SONAR_HOST_URL: ${SONAR_HOST_URL}
      SONAR_TOKEN: ${SONAR_TOKEN}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - mergemarket

volumes:
  pgdata:
  redisdata:
  auth_certs:
  sonar_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  grafana_data:
  kong_generated:

networks:
  mergemarket:
    driver: bridge
