---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: mergemarket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      containers:
        - name: kong
          image: kong:3.7
          command: ["/bin/sh", "-c"]
          args:
            - secret=$(printf '%s' "$JWT_SECRET" | sed 's/[\/&]/\\&/g'); sed "s|__JWT_SECRET__|${secret}|g" /kong/template/kong.yml > /kong/generated/kong.yml; exec kong docker-start
          ports:
            - name: proxy
              containerPort: 8000
            - name: admin
              containerPort: 8001
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/generated/kong.yml
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mergemarket-secrets
                  key: JWT_SECRET
          volumeMounts:
            - name: kong-template
              mountPath: /kong/template
              readOnly: true
            - name: kong-generated
              mountPath: /kong/generated
      volumes:
        - name: kong-template
          configMap:
            name: kong-config
        - name: kong-generated
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: mergemarket
spec:
  type: NodePort
  selector:
    app: kong
  ports:
    - name: proxy
      port: 8000
      targetPort: proxy
      nodePort: 30088
    - name: admin
      port: 8001
      targetPort: admin
      nodePort: 30081
