apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: mergemarket
spec:
  selector:
    app: auth
  ports:
    - name: http
      port: 8091
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-validator
  namespace: mergemarket
spec:
  selector:
    app: proxy-validator
  ports:
    - name: http
      port: 8086
      targetPort: http
